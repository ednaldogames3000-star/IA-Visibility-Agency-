<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>C+V — Painel Administrativo</title><style>:root{--bg:#07070a;--panel:#101017;--line:#292933;--text:#f7f7fa;--muted:#9696a5;--v:#8b5cf6;--ok:#72e0a1;--bad:#ff7d91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.login{min-height:100vh;display:grid;place-items:center}.box,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px}.box{width:min(420px,100%);padding:30px}.brand{font-size:20px;font-weight:900;margin-bottom:24px}.brand span{color:#cbb7ff}label{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#08080c;color:#fff;outline:0}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--v);color:#fff;font-weight:800}.error{color:var(--bad);font-size:12px;margin-top:12px}.hidden{display:none!important}.top{padding:22px 0;border-bottom:1px solid var(--line)}.nav{display:flex;justify-content:space-between;align-items:center;gap:15px}.logout{background:#17171f;border:1px solid var(--line)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:#101017;border:1px solid var(--line)}.tabs button.active{background:var(--v);border-color:var(--v)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{padding:18px}.card small{color:var(--muted)}.num{font-size:30px;font-weight:900;margin-top:7px}.panel{margin-top:14px;padding:20px}.panel h2{margin-top:0}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:10px;text-transform:uppercase}.status{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:99px}.ok{color:var(--ok)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.box{padding:22px}}</style></head>
<body><div id="login" class="login"><form id="loginForm" class="box"><div class="brand">C+<span>V</span> · Admin</div><label>Usuário</label><input id="user" autocomplete="username" required><label>Senha</label><input id="pass" type="password" autocomplete="current-password" required><button type="submit">Entrar</button><div id="loginError" class="error"></div></form></div>
<div id="app" class="hidden"><header class="top"><div class="wrap nav"><div class="brand">C+<span>V</span> · Painel</div><button class="logout" id="logout">Sair</button></div></header><main class="wrap"><div class="tabs"><button data-tab="overview" class="active">Visão geral</button><button data-tab="customers">Clientes</button><button data-tab="audits">Auditorias</button><button data-tab="leads">Leads</button><button data-tab="logs">Logs</button></div><section id="overview" class="view"><div class="grid"><div class="card"><small>Clientes</small><div id="sCustomers" class="num">—</div></div><div class="card"><small>Auditorias</small><div id="sAudits" class="num">—</div></div><div class="card"><small>Leads</small><div id="sLeads" class="num">—</div></div><div class="card"><small>Novos leads</small><div id="sNew" class="num">—</div></div><div class="card"><small>Logs</small><div id="sLogs" class="num">—</div></div></div><div class="panel card"><h2>Saúde do sistema</h2><div id="health">Consultando…</div></div></section><section id="customers" class="view hidden"><div class="panel card"><h2>Novo cliente</h2><form id="customerForm"><label>Nome *</label><input name="name" required><label>Empresa</label><input name="company"><label>E-mail</label><input name="email" type="email"><label>Telefone</label><input name="phone"><label>Observações</label><textarea name="notes"></textarea><br><br><button>Salvar cliente</button></form></div><div class="panel card"><h2>Histórico de clientes</h2><div id="customersTable" class="table"></div></div></section><section id="audits" class="view hidden"><div class="panel card"><h2>Auditorias</h2><div id="auditsTable" class="table"></div></div></section><section id="leads" class="view hidden"><div class="panel card"><h2>Leads</h2><div id="leadsTable" class="table"></div></div></section><section id="logs" class="view hidden"><div class="panel card"><h2>Logs</h2><div id="logsTable" class="table"></div></div></section></main></div>
<script>
const $=s=>document.querySelector(s);let token=localStorage.getItem('costa_admin_token');
function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadAll() } if(token) showApp();
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#user').value,password:$('#pass').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha');token=d.token;localStorage.setItem('costa_admin_token',token);showApp()}catch(x){$('#loginError').textContent=x.message}});
$('#logout').onclick=()=>{localStorage.removeItem('costa_admin_token');location.reload()};
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){localStorage.removeItem('costa_admin_token');location.reload();throw Error('Sessão expirada')}const d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(el,headers,rows){$(el).innerHTML='<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
async function loadAll(){try{const [s,h,c,a,l,g]=await Promise.all([api('/api/admin/stats'),fetch('/api/health').then(r=>r.json()),api('/api/admin/customers'),api('/api/admin/audits'),api('/api/admin/leads'),api('/api/admin/logs')]);$('#sCustomers').textContent=s.customers;$('#sAudits').textContent=s.audits;$('#sLeads').textContent=s.leads;$('#sNew').textContent=s.newLeads;$('#sLogs').textContent=s.logs;$('#health').innerHTML=h.status==='ok'?'<span class="ok">● PostgreSQL conectado</span> · uptime '+h.uptimeSeconds+'s':'Banco não configurado';table('#customersTable',['Nome','Empresa','E-mail','Status','Criado'],c.customers.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.company)+'</td><td>'+esc(x.email)+'</td><td><span class="status">'+esc(x.status)+'</span></td><td>'+esc(x.createdAt)+'</td></tr>'));table('#auditsTable',['ID','URL','Score','Criado'],a.audits.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.url)+'</td><td>'+esc(x.score)+'</td><td>'+esc(x.createdAt)+'</td></tr>'));table('#leadsTable',['Nome','Empresa','Contato','Origem','Status','Criado'],l.leads.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.company)+'</td><td>'+esc(x.email||x.phone)+'</td><td>'+esc(x.source)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.createdAt)+'</td></tr>'));table('#logsTable',['Nível','Evento','Ator','Request','Criado'],g.logs.map(x=>'<tr><td>'+esc(x.level)+'</td><td>'+esc(x.event)+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.requestId)+'</td><td>'+esc(x.createdAt)+'</td></tr>'))}catch(e){console.error(e)}}
$('#customerForm').addEventListener('submit',async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));try{await api('/api/admin/customers',{method:'POST',body:JSON.stringify(o)});e.target.reset();loadAll()}catch(x){alert(x.message)}});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.tab).classList.remove('hidden');b.classList.add('active')});
</script></body></html>
